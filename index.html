<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Daily tasks</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20242d;
      background: #f5f6f8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #747b88;
      --line: #e8eaf0;
      --accent: #5b5bd6;
      --accent-dark: #4848b8;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 64px 20px;
      background:
        radial-gradient(ellipse at 50% -15%, #e8e8ff 0, transparent 48%),
        #f5f6f8;
    }

    .app {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 2.7rem);
      letter-spacing: -0.055em;
      line-height: 1.1;
    }

    .intro {
      margin: 12px 0 28px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }

    .board {
      overflow: hidden;
      border: 1px solid #e9eaf0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 16px 50px rgb(32 36 45 / 8%);
    }

    form {
      display: flex;
      gap: 10px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #dfe2e9;
      border-radius: 10px;
      outline: none;
      color: inherit;
      font: inherit;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    input[type="text"]::placeholder { color: #a0a5b0; }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(91 91 214 / 14%);
    }

    button { font: inherit; }

    .add-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 48px;
      padding: 0 17px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 650;
      transition: background 150ms ease, transform 150ms ease;
    }

    .add-button:hover { background: var(--accent-dark); }
    .add-button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgb(91 91 214 / 35%);
      outline-offset: 2px;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 20px 12px;
    }

    .count {
      color: #646b78;
      font-size: 0.86rem;
      font-weight: 600;
    }

    .filters {
      display: flex;
      gap: 4px;
      padding: 3px;
      border-radius: 9px;
      background: #f3f4f7;
    }

    .filter-button {
      padding: 6px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #727987;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .filter-button[aria-pressed="true"] {
      background: white;
      color: #353a45;
      box-shadow: 0 1px 3px rgb(32 36 45 / 12%);
    }

    .task-list {
      margin: 0;
      padding: 0 20px;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      border-top: 1px solid var(--line);
    }

    .task-check {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .task.completed .task-text {
      color: #969ca7;
      text-decoration: line-through;
    }

    .delete-button {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #8b929f;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
    }

    .delete-button:hover {
      background: #fff0ef;
      color: #c3443e;
    }

    .empty {
      padding: 42px 16px 46px;
      color: #858c99;
      text-align: center;
      font-size: 0.93rem;
    }

    .empty-icon {
      display: grid;
      width: 44px;
      height: 44px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 14px;
      background: #f2f2ff;
      color: var(--accent);
      font-size: 1.3rem;
    }

    .message {
      min-height: 20px;
      margin: 12px 2px 0;
      color: #a13d38;
      font-size: 0.84rem;
    }

    @media (max-width: 480px) {
      body { padding: 38px 14px; }
      form { padding: 15px; }
      .list-header { align-items: flex-start; flex-direction: column; padding-inline: 15px; }
      .task-list { padding-inline: 15px; }
      .add-button { padding-inline: 14px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">A little more focus</p>
    <h1>Daily tasks</h1>
    <p class="intro">Keep track of what matters today. Your list stays saved in this browser.</p>

    <section class="board" aria-label="Task list">
      <form id="task-form">
        <label for="task-input" class="visually-hidden">New task</label>
        <input id="task-input" type="text" maxlength="240" placeholder="What needs to get done?" autocomplete="off" required>
        <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
      </form>
      <div class="list-header">
        <span class="count" id="task-count" aria-live="polite"></span>
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </nav>
      </div>
      <ul class="task-list" id="task-list"></ul>
      <div class="empty" id="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">✓</div>
        <span id="empty-message">No tasks yet. Add one to get started.</span>
      </div>
    </section>
    <p class="message" id="storage-message" role="status" aria-live="polite"></p>
  </main>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }
  </style>
  <script>
    (() => {
      const STORAGE_KEY = "daily-tasks-v1";
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const count = document.querySelector("#task-count");
      const emptyState = document.querySelector("#empty-state");
      const emptyMessage = document.querySelector("#empty-message");
      const message = document.querySelector("#storage-message");
      const filterButtons = document.querySelectorAll("[data-filter]");
      let activeFilter = "all";
      let tasks = [];

      function readTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved === null) return [];
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) throw new Error("Saved tasks are not a list.");
          return parsed.filter(task =>
            task &&
            typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          );
        } catch (error) {
          message.textContent = "Your saved tasks couldn't be read. Add a task to start a new list.";
          console.error("Unable to load tasks from local storage.", error);
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          message.textContent = "";
        } catch (error) {
          message.textContent = "Changes couldn't be saved in this browser. Check your storage settings.";
          console.error("Unable to save tasks to local storage.", error);
        }
      }

      function render() {
        const visibleTasks = tasks.filter(task =>
          activeFilter === "all" ||
          (activeFilter === "active" && !task.completed) ||
          (activeFilter === "completed" && task.completed)
        );
        const remaining = tasks.filter(task => !task.completed).length;
        count.textContent = `${remaining} task${remaining === 1 ? "" : "s"} left`;
        list.replaceChildren();

        for (const task of visibleTasks) {
          const item = document.createElement("li");
          item.className = `task${task.completed ? " completed" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.className = "task-check";
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.setAttribute("aria-label", `Mark "${task.text}" ${task.completed ? "active" : "completed"}`);
          checkbox.dataset.action = "toggle";
          checkbox.dataset.id = task.id;

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;

          const remove = document.createElement("button");
          remove.className = "delete-button";
          remove.type = "button";
          remove.setAttribute("aria-label", `Delete "${task.text}"`);
          remove.dataset.action = "delete";
          remove.dataset.id = task.id;
          remove.textContent = "×";

          item.append(checkbox, text, remove);
          list.append(item);
        }

        const isEmpty = visibleTasks.length === 0;
        emptyState.hidden = !isEmpty;
        emptyMessage.textContent = tasks.length === 0
          ? "No tasks yet. Add one to get started."
          : activeFilter === "active"
            ? "You're all caught up."
            : activeFilter === "completed"
              ? "No completed tasks yet."
              : "No tasks to show.";
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        tasks.unshift({
          id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          text,
          completed: false
        });
        saveTasks();
        render();
        input.value = "";
        input.focus();
      });

      list.addEventListener("change", event => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement) || target.dataset.action !== "toggle") return;
        const task = tasks.find(item => item.id === target.dataset.id);
        if (!task) return;
        task.completed = target.checked;
        saveTasks();
        render();
      });

      list.addEventListener("click", event => {
        const target = event.target;
        if (!(target instanceof HTMLButtonElement) || target.dataset.action !== "delete") return;
        tasks = tasks.filter(task => task.id !== target.dataset.id);
        saveTasks();
        render();
      });

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;
          filterButtons.forEach(filter => {
            filter.setAttribute("aria-pressed", String(filter === button));
          });
          render();
        });
      });

      tasks = readTasks();
      render();
    })();
  </script>
</body>
</html>
